<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 말투 변환기 — BizTalk</title>
  <meta name="description" content="하고 싶은 말을 편하게 입력하면 상황과 상대에 맞는 비즈니스 언어로 자동 변환해 주는 AI 업무 말투 변환기">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">💼</span>
        <h1 class="brand-title">업무 말투 변환기</h1>
        <span class="brand-badge">Solar-Pro4 AI</span>
      </div>
      <p class="brand-subtitle">
        전달하고 싶은 내용을 편하게 입력하세요. 수신 대상에 맞는 정중하고 품격 있는 비즈니스 어조로 변환해 드립니다.
      </p>
    </header>

    <!-- Main Card -->
    <main class="main-card">
      <!-- Target Selector Section -->
      <section class="target-section" aria-labelledby="target-heading">
        <div class="section-label" id="target-heading">
          <span class="label-number">1</span>
          <span>메시지를 받을 상대를 선택하세요</span>
        </div>
        <div class="target-grid" role="radiogroup" aria-label="수신 대상 선택">
          <button type="button" class="target-btn active" data-target="boss" role="radio" aria-checked="true">
            <span class="target-icon">👔</span>
            <div class="target-info">
              <span class="target-name">상사 / 임원</span>
              <span class="target-desc">격식 있는 극존칭 경어체</span>
            </div>
          </button>
          <button type="button" class="target-btn" data-target="colleague" role="radio" aria-checked="false">
            <span class="target-icon">🤝</span>
            <div class="target-info">
              <span class="target-name">타팀 동료</span>
              <span class="target-desc">정중하고 협조적인 어조</span>
            </div>
          </button>
          <button type="button" class="target-btn" data-target="client" role="radio" aria-checked="false">
            <span class="target-icon">🌐</span>
            <div class="target-info">
              <span class="target-name">고객 / 외부</span>
              <span class="target-desc">친절하고 신뢰감 있는 어조</span>
            </div>
          </button>
          <button type="button" class="target-btn" data-target="team" role="radio" aria-checked="false">
            <span class="target-icon">👥</span>
            <div class="target-info">
              <span class="target-name">팀 내 동료</span>
              <span class="target-desc">간결하고 명확한 실무 어조</span>
            </div>
          </button>
        </div>
      </section>

      <!-- Conversion Workspace (Input / Output Grid) -->
      <div class="workspace-grid">
        <!-- Input Column -->
        <section class="panel input-panel">
          <div class="panel-header">
            <div class="section-label">
              <span class="label-number">2</span>
              <span>원문 입력</span>
            </div>
            <span class="char-count" id="charCount">0자</span>
          </div>
          <div class="textarea-wrapper">
            <textarea
              id="inputText"
              class="text-input"
              rows="7"
              placeholder="예: 내일까지 보고서 제출 어려울 것 같음. 일정 조금만 미룰 수 있을까요?"
              maxlength="2000"
              aria-label="변환할 원문 내용"
            ></textarea>
          </div>
          <div class="panel-footer">
            <button type="button" id="clearBtn" class="secondary-btn" title="입력 지우기">지우기</button>
            <button type="button" id="convertBtn" class="primary-btn">
              <span class="btn-spinner" id="btnSpinner" aria-hidden="true"></span>
              <span class="btn-text" id="btnText">비즈니스 말투로 변환하기 ✨</span>
            </button>
          </div>
        </section>

        <!-- Output Column -->
        <section class="panel output-panel">
          <div class="panel-header">
            <div class="section-label">
              <span class="label-number">3</span>
              <span>변환 결과</span>
            </div>
            <span class="badge-target" id="resultTargetBadge">상사 / 임원 톤</span>
          </div>
          <div class="textarea-wrapper output-wrapper">
            <div id="outputPlaceholder" class="output-placeholder">
              <div class="placeholder-icon">✍️</div>
              <p>원문을 입력하고 <strong>[변환하기]</strong> 버튼을 누르면<br>비즈니스 매너에 맞게 정제된 문장이 생성됩니다.</p>
            </div>
            <textarea
              id="outputText"
              class="text-input text-output hidden"
              rows="7"
              readonly
              aria-label="변환된 비즈니스 텍스트 결과"
            ></textarea>
          </div>
          <div class="panel-footer right-align">
            <button type="button" id="copyBtn" class="copy-btn" disabled>
              <span class="copy-icon">📋</span>
              <span class="copy-text">결과 복사하기</span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Powered by <strong>Upstage Solar-Pro4</strong> &amp; <strong>FastAPI</strong></p>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <span class="toast-icon">✅</span>
      <span class="toast-message" id="toastMessage">클립보드에 복사되었습니다!</span>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
